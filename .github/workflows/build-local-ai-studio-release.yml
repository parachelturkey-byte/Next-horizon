name: Build Local AI Studio Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'releases/local-ai-studio/main.py'
      - '.github/workflows/build-local-ai-studio-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content 'releases/local-ai-studio/main.py' -Raw
          $m = [regex]::Match($text, 'VERSION="([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $m.Success) { throw "VERSION not found" }
          $version = $m.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=local-ai-studio-v$version" >> $env:GITHUB_OUTPUT
          "exe=NextHorizonLocalAIStudio-v$version.exe" >> $env:GITHUB_OUTPUT

      - name: Build EXE
        shell: pwsh
        run: |
          $exe = '${{ steps.version.outputs.exe }}'
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ([IO.Path]::GetFileNameWithoutExtension($exe)) releases/local-ai-studio/main.py
          & ".\dist\$exe" --health-probe
          if ($LASTEXITCODE -ne 0) { throw "health_probe_failed" }

      - name: Create manifest
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $exe = '${{ steps.version.outputs.exe }}'
          $path = ".\dist\$exe"
          $sha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $path).Length
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$exe"
          $manifest = [ordered]@{
            version = $version
            filename = $exe
            sha256 = $sha
            size = $size
            download_url = $url
          } | ConvertTo-Json
          Set-Content -Path 'releases/local-ai-studio/latest.json' -Value $manifest -Encoding utf8
          Write-Host "SHA256=$sha SIZE=$size"

      - name: Publish release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $exe = '${{ steps.version.outputs.exe }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Next Horizon Local AI Studio ${{ steps.version.outputs.version }}" --notes "Automated Windows release for Next Horizon Local AI Studio."
          }
          gh release upload $tag ".\dist\$exe" --clobber

      - name: Commit manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/local-ai-studio/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update Local AI Studio release manifest"
            git push
          }
